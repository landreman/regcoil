name: CodSpeed

on:
  push:
    branches:
      - master
  # Required for CodSpeed to report a comparison against master on each PR.
  pull_request:
  # Lets CodSpeed trigger backtest runs to seed the historical data.
  workflow_dispatch:

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OpenID Connect authentication with CodSpeed
    env:
      # The benchmarks are pinned to a single thread. The shared GitHub runners
      # give us 4 noisy vCPUs, and letting OpenMP/BLAS spread across them adds
      # far more run-to-run scatter than the regressions we want to detect.
      # Raise these (and accept the noise) if you ever want to track scaling.
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"

    steps:
      - uses: actions/checkout@v7

      # OpenBLAS, not the libblas-dev of ci.yml.  regcoil_kernels_mod builds the
      # g matrix with a DGEMM per zeta_plasma block, which dominates the
      # Regcoil() init benchmark (hundreds of GFLOP at this resolution).
      # libblas-dev is the unblocked netlib reference implementation and runs
      # that at a few GFLOP/s; OpenBLAS is roughly an order of magnitude faster.
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gfortran \
            libopenblas-dev \
            pkg-config

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install regcoil (builds the Fortran extension) + benchmark deps
        run: |
          python -m pip install -U pip
          pip install -v ".[bench]"
          python -c "import regcoil._core; print('regcoil._core OK')"

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: pytest benchmarks/ --codspeed
