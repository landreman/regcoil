name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: build (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      # OpenBLAS rather than libblas-dev: the operator build spends most of its
      # time in DGEMM, and the netlib reference BLAS that libblas-dev provides
      # runs it about an order of magnitude slower.  This is what made the slow
      # tests so painful on the Linux runners.  The release wheels already
      # build against openblas (see [tool.cibuildwheel.linux] in
      # pyproject.toml), so this also brings CI in line with what ships.
      - name: Install system deps (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gfortran \
            libopenblas-dev \
            pkg-config

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gcc pkg-config

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python package (builds Fortran extension via pip)
        run: |
          python -m pip install -U pip
          pip install -v ".[dev]"
          python -c "import regcoil._core; print('regcoil._core OK')"

      # Optional dependency used by tests/unit/test_read_vmec_wout.py. Not a hard
      # requirement of regcoil. Wheels exist for 3.10–3.13; 3.14 would fall back
      # to a source build, so skip there and let importorskip cover that job.
      #
      # Pinned below 1.11: the 1.11.0 manylinux_2_28 x86_64 wheels have simsoptpp
      # compiled with -march=native on an AVX-512 build host, so `import simsopt`
      # dies with SIGILL ("Illegal instruction (core dumped)", exit 132) on the
      # AVX-512-less machines in the ubuntu-latest runner pool.  Which matrix jobs
      # land on such a machine is luck of the draw, so this shows up as random
      # per-python-version failures.  Drop the pin once upstream ships wheels
      # built for a baseline microarchitecture again (simsopt CMakeLists.txt
      # targets westmere when CI is set, but that variable does not reach the
      # cibuildwheel container).
      - name: Install simsopt (for Vmec wout object tests)
        if: matrix.python-version != '3.14'
        run: pip install "simsopt<1.11"

      - name: Run pytest tests
        run: |
          pytest

  docs:
    name: docs (build + doctest + nbmake)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gfortran \
            libopenblas-dev \
            pkg-config

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python package + docs extra
        run: |
          python -m pip install -U pip
          pip install -v ".[docs]"
          python -c "import regcoil._core; print('regcoil._core OK')"

      - name: Sphinx build (warnings are errors)
        run: sphinx-build -W -b html docs docs/_build/html

      - name: Doctest
        run: sphinx-build -b doctest docs docs/_build/doctest

      - name: nbmake safety net over the executed doc pages
        run: |
          mkdir -p /tmp/doc_notebooks
          for f in docs/quickstart.md docs/usage.md docs/plotting.md; do
            jupytext --to ipynb --output "/tmp/doc_notebooks/$(basename "${f%.md}").ipynb" "$f"
          done
          pytest --nbmake /tmp/doc_notebooks --nbmake-timeout=600
