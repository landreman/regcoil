name: CodSpeed

on:
  push:
    branches:
      - master
  # Required for CodSpeed to report a comparison against master on each PR.
  pull_request:
  # Lets CodSpeed trigger backtest runs to seed the historical data.
  workflow_dispatch:

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OpenID Connect authentication with CodSpeed
    env:
      # The benchmarks are pinned to a single thread. CodSpeed's CPU-simulation
      # instrument measures the benchmark inside a CPU simulator, where the
      # thread count changes what is counted without saying anything useful
      # about a real machine, so keeping OpenMP/BLAS on one thread is what
      # makes the numbers comparable from run to run.
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"

    steps:
      - uses: actions/checkout@v7

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gfortran \
            libblas-dev \
            pkg-config

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install regcoil (builds the Fortran extension) + benchmark deps
        run: |
          python -m pip install -U pip
          pip install -v ".[bench]"
          python -c "import regcoil._core; print('regcoil._core OK')"

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: pytest benchmarks/ --codspeed
